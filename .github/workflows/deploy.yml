name: Build & Deploy DeltaV Azure Function

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - main
      resourceGroupName:
        description: 'Azure Resource Group to deploy to'
        required: true
        default: opalalign-rg-dev
        type: choice
        options:
          - opalalign-rg-dev
          - opalalign-rg
      functionAppName:
        description: 'Azure Function App to deploy to'
        required: true
        default: deltavapi-dev
        type: choice
        options:
          - trace-app-prod
          - deltavapi-dev
          - deltavapi

env:
  JAVA_VERSION: '21'
  FUNCTION_APP_NAME: ${{ github.event.inputs.functionAppName }}
  RESOURCE_GROUP_NAME: ${{ github.event.inputs.resourceGroupName }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Deploy Info
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Function App: ${{ env.FUNCTION_APP_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP_NAME }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build with Maven
        working-directory: api
        run: |
          mvn clean package azure-functions:package \
            -DfunctionAppName=${{ env.FUNCTION_APP_NAME }} -DresourceGroupName=${{ env.RESOURCE_GROUP_NAME }} \
            --batch-mode --no-transfer-progress

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AKS_DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ vars.AKS_DEPLOYMENT_TENANT_ID }}
          client-secret: ${{ secrets.AKS_DEPLOYMENT_CLIENT_SECRET }}
          subscription-id: ${{ vars.AKS_DEPLOYMENT_AZURE_SUBSCRIPTION }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: api/target/azure-functions/${{ env.FUNCTION_APP_NAME }}

      - name: Configure App Settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            # All services use system-assigned managed identity
            # Required RBAC roles on Storage Account:
            #   - Storage Queue Data Contributor (for queue publishing)
            #   - Storage Table Data Contributor (for token validation)
            #   - Storage Blob Data Reader (for practice config)
            # Required for Redis:
            #   - Enable Entra ID auth on Redis
            #   - Grant managed identity access to Redis
            az functionapp config appsettings set \
              --name ${{ env.FUNCTION_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --settings \
                "REGISTRATION_TOKEN_SECRET=${{ secrets.REGISTRATION_TOKEN_SECRET }}" \
                "STORAGE_ACCOUNT_NAME=${{ vars.STORAGE_ACCOUNT_NAME }}" \
                "REDIS_HOST=${{ vars.REDIS_HOST }}" \
                "REDIS_USER=${{ vars.REDIS_USER }}" \
                "REDIS_PORT=${{ vars.REDIS_PORT }}" \
                "AZURE_COMMUNICATION_CONNECTION_STRING=${{ vars.AZURE_COMMUNICATION_CONNECTION_STRING }}" \
                "SMS_DEFAULT_FROM_NUMBER=${{ vars.SMS_DEFAULT_FROM_NUMBER }}" \
                "KEY_VAULT_URL=${{ vars.KEY_VAULT_URL }}"
