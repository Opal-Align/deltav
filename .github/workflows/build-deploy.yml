name: Build & Deploy DeltaV

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      rollout_deployment:
        description: 'Trigger rollout of deployment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NAMESPACE: deltav
  IMAGE_TAG: latest
  IMAGE_NAME: deltav
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  DEPLOYMENT_NAME: deltav

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Environment Info
        run: |
          echo "Registry: ${{ env.IMAGE_REGISTRY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.IMAGE_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AKS_DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ vars.AKS_DEPLOYMENT_TENANT_ID }}
          client-secret: ${{ secrets.AKS_DEPLOYMENT_CLIENT_SECRET }}
          subscription-id: ${{ vars.AKS_DEPLOYMENT_AZURE_SUBSCRIPTION }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RG_NAME }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Create namespace if not exists
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} || kubectl create namespace ${{ env.NAMESPACE }}

      - name: Apply Ingress
        working-directory: k8s
        run: |
          kubectl apply -f ingress.yaml -n ${{ env.NAMESPACE }}

      - name: Apply Service
        working-directory: k8s
        run: |
          kubectl apply -f service.yaml -n ${{ env.NAMESPACE }}

      - name: Deploy
        working-directory: k8s
        run: |
          export REGISTRY_URL=${{ env.IMAGE_REGISTRY }}
          export IMAGE_NAME=${{ env.IMAGE_NAME }}
          envsubst < deployment.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

      - name: Restart Deployment in AKS
        if: ${{ github.event.inputs.rollout_deployment == 'true' }}
        run: kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
