name: Build & Push Sikka Appointment Worker

run-name: >-
  Build Sikka Worker · ${{ github.event.inputs.environment }} ·
  ${{ github.event.inputs.image_tag }}

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main
      image_tag:
        description: 'Image tag to build and push'
        required: false
        default: 'latest'
        type: string

env:
  MODULE_DIR: sikka-appointment-worker-python
  IMAGE_TAG: ${{ github.event.inputs.image_tag }}
  IMAGE_NAME: sikka-appointment-worker-python-${{ github.event.inputs.environment }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}

jobs:
  build-and-push:
    name: Build & Push (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Build Info
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Registry: ${{ env.IMAGE_REGISTRY }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.IMAGE_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        working-directory: ${{ env.MODULE_DIR }}
        run: docker build -t ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
