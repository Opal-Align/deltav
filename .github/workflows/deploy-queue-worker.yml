name: Build & Deploy Queue Worker

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Kubernetes namespace'
        required: true
        type: choice
        options:
          - marquee-test
          - marquee
          - default
      environment:
        description: 'Environment (dev/main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main
      client_id:
        description: 'Client ID for the queue worker'
        required: true
        type: string
      sql_database:
        description: 'SQL Database name'
        required: true
        type: string
      rollout_deployment:
        description: 'Trigger rollout of deployment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NAMESPACE: ${{ github.event.inputs.namespace }}
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  MODULE_DIR: queue-worker-python
  IMAGE_TAG: latest
  IMAGE_NAME: queue-worker-python-${{ github.event.inputs.environment }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Environment Info
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Namespace: ${{ github.event.inputs.namespace }}"
          echo "Client ID: ${{ github.event.inputs.client_id }}"
          echo "SQL Database: ${{ github.event.inputs.sql_database }}"
          echo "Registry: ${{ env.IMAGE_REGISTRY }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.IMAGE_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        working-directory: ${{ env.MODULE_DIR }}
        run: docker build -t ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AKS_DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ vars.AKS_DEPLOYMENT_TENANT_ID }}
          client-secret: ${{ secrets.AKS_DEPLOYMENT_CLIENT_SECRET }}
          subscription-id: ${{ vars.AKS_DEPLOYMENT_AZURE_SUBSCRIPTION }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RG_NAME }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Deploy Service Account
        working-directory: ${{ env.MODULE_DIR }}/k8s
        run: |
          kubectl apply -f service-account-${{ env.ENVIRONMENT }}.yaml -n ${{ env.NAMESPACE }}

      - name: Deploy ConfigMap
        working-directory: ${{ env.MODULE_DIR }}/k8s
        run: |
          kubectl apply -f configmap-${{ env.ENVIRONMENT }}.yaml -n ${{ env.NAMESPACE }}

      - name: Deploy Secret
        working-directory: ${{ env.MODULE_DIR }}/k8s
        run: |
          export CLIENT_ID=${{ github.event.inputs.client_id }}
          export SQL_DATABASE=${{ github.event.inputs.sql_database }}
          envsubst < secret-${{ env.ENVIRONMENT }}.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

      - name: Deploy to AKS
        working-directory: ${{ env.MODULE_DIR }}/k8s
        run: |
          export CLIENT_ID=${{ github.event.inputs.client_id }}
          export REGISTRY_URL=${{ env.IMAGE_REGISTRY }}
          export IMAGE_NAME=${{ env.IMAGE_NAME }}
          envsubst < deployment.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -

      - name: Restart Deployment in AKS
        if: ${{ github.event.inputs.rollout_deployment == 'true' }}
        run: kubectl rollout restart deployment/queue-worker-${{ github.event.inputs.client_id }} -n ${{ env.NAMESPACE }}