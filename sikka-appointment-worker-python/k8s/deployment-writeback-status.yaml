# Deploy per client - pass CLIENT_ID at deployment time
# Usage: export CLIENT_ID=client1 && envsubst < deployment-writeback-status.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sikka-writeback-status-worker-${CLIENT_ID}
  labels:
    app: sikka-writeback-status-worker
    client: "${CLIENT_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sikka-writeback-status-worker
      client: "${CLIENT_ID}"
  template:
    metadata:
      labels:
        app: sikka-writeback-status-worker
        client: "${CLIENT_ID}"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: queue-worker-sa
      containers:
        - name: worker
          image: ${REGISTRY_URL}/${IMAGE_NAME}:latest
          command: ["python", "writeback_status_worker.py"]
          env:
            - name: CLIENT_ID
              value: "${CLIENT_ID}"
            # SQL Server (SQL Authentication)
            - name: SQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: sikka-appointment-worker-${CLIENT_ID}-secrets
                  key: SQL_CONNECTION_STRING
          envFrom:
            - configMapRef:
                name: sikka-appointment-worker-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
