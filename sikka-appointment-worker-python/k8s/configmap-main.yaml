apiVersion: v1
kind: ConfigMap
metadata:
  name: sikka-appointment-worker-config
data:
  POLL_INTERVAL: "1.0"
  BATCH_SIZE: "16"
  VISIBILITY_TIMEOUT: "30"
  MAX_RETRIES: "3"
  RETRY_DELAY: "1.0"
  SIKKA_API_URL: "https://api.sikkasoft.com/v4/appointment"
  SIKKA_HTTP_TIMEOUT: "15"
  SIKKA_MAX_DEQUEUE_COUNT: "5"
  AZURE_STORAGE_ACCOUNT_URL: "https://traceappprod.queue.core.windows.net"