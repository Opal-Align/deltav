apiVersion: apps/v1
kind: Deployment
metadata:
  name: deltav
  labels:
    app: deltav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deltav
  template:
    metadata:
      labels:
        app: deltav
    spec:
      containers:
        - name: deltav
          image: ${REGISTRY_URL}/${IMAGE_NAME}:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
