# Per-client secret - create one for each client
# Usage: export CLIENT_ID=client1 && envsubst < secret-dev.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: queue-worker-${CLIENT_ID}-secrets
type: Opaque
stringData:
  # SQL Server with SQL Authentication (username/password)
  SQL_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=${SQL_SERVER};Database=${SQL_DATABASE};Uid=${SQL_USER};Pwd=${SQL_PASSWORD};Encrypt=yes;TrustServerCertificate=no"

  # Optional: Fallback connection string for Azure Storage (only if Managed Identity unavailable)
  # AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=xxx;AccountKey=xxx;EndpointSuffix=core.windows.net"