kind: Secret
metadata:
  name: queue-worker-${CLIENT_ID}-secrets
type: Opaque
stringData:
  # SQL Server with SQL Authentication (username/password)
  SQL_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=opal-align-production-sql.public.98b8ebeee527.database.windows.net,3342;Database=AppDB_101;Uid=sqladmin;Pwd=Opalalignprod44$$;Encrypt=yes;TrustServerCertificate=no"

  # Optional: Fallback connection string for Azure Storage (only if Managed Identity unavailable)
