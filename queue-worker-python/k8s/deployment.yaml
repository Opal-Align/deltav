# Deploy per client - pass CLIENT_ID at deployment time
# Usage: export CLIENT_ID=client1 && envsubst < deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker-${CLIENT_ID}
  namespace: ${NAMESPACE}
  labels:
    app: queue-worker
    client: ${CLIENT_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-worker
      client: ${CLIENT_ID}
  template:
    metadata:
      labels:
        app: queue-worker
        client: ${CLIENT_ID}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: queue-worker-sa
      containers:
        - name: worker
          image: ${REGISTRY_URL}/${IMAGE_NAME}:latest
          env:
            - name: CLIENT_ID
              value: "${CLIENT_ID}"
            # SQL Server (SQL Authentication)
            - name: SQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: queue-worker-${CLIENT_ID}-secrets
                  key: SQL_CONNECTION_STRING
          envFrom:
            - configMapRef:
                name: queue-worker-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      restartPolicy: Always
      terminationGracePeriodSeconds: 30